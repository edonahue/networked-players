[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "networked-players-research"
version = "0.1.0"
description = "Personal research platform: bounded topic corpora and analyses over the full canonical Discogs data (Phase 3) -- strictly separate from the public/publication lane"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2,<2",
  "networked-players-catalog",
  "networked-players-contracts",
]

# Graph-library benchmark/analytics dependencies (Slice C) -- deliberately
# not in the base install, so packages/research's request/corpus contract
# stays usable without pulling in three graph libraries nobody needs yet.
[project.optional-dependencies]
graph = [
  "networkx>=3,<4",
  "python-igraph>=0.11,<1",
  "rustworkx>=0.15,<1",
]

[project.scripts]
networked-players-research = "networked_players_research.cli:main"

[tool.uv.sources]
networked-players-catalog = { workspace = true }
networked-players-contracts = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
