---
# Deploys the PATHFINDING-GRAPH artifact-check job body
# (files/public_artifact_check_job.py) AND the real pathfinding graph.v1/
# albums.v1 artifacts to Pi workers' persistent RQ jobs directory. Same
# job-body-plus-artifact pattern as deploy-contributor-index-check-job.yml,
# sharing the same job body file (public_artifact_check_job.py).
#
# The catalog copy here is deliberately redundant with
# deploy-catalog-check-job.yml's and deploy-contributor-index-check-job.yml's
# own copies (same file, same "albums.v1.json" destination name) rather than
# a shared reference -- each deploy playbook stays independently runnable.
#
# hosts: pi_workers, not the flat `workers` group -- this is Pi-ambient
# validation work, not x86-worker traversal/scoring work.
#
# Usage (from infra/ansible/, with a real local inventory):
#   ansible-playbook -i inventories/local/hosts.yml playbooks/deploy-pathfinding-graph-check-job.yml \
#     --limit worker-01.example.internal
#   # override the artifact sources:
#   ansible-playbook -i inventories/local/hosts.yml playbooks/deploy-pathfinding-graph-check-job.yml \
#     -e pathfinding_graph_artifact_path=apps/web/public/data/pathfinding/graph.v1.json \
#     -e catalog_artifact_path=apps/web/public/data/catalog/albums.v1.json
- name: Deploy the pathfinding-graph artifact-check job to Pi workers
  hosts: pi_workers
  gather_facts: true
  vars:
    rq_jobs_dir: "{{ ansible_env.HOME }}/.local/share/networked-players/rq-jobs"
    pathfinding_graph_artifact_path: apps/web/public/data/pathfinding/graph.v1.json
    catalog_artifact_path: apps/web/public/data/catalog/albums.v1.json
  tasks:
    - name: Require the artifacts to exist on the control node
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../{{ item }}"
      register: artifact_stat
      delegate_to: localhost
      become: false
      loop:
        - "{{ pathfinding_graph_artifact_path }}"
        - "{{ catalog_artifact_path }}"

    - name: Fail loudly if an artifact is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          No artifact at {{ item.item }}. Build one first
          (uv run networked-players-catalog build-pathfinding-graph ...)
          or pass -e pathfinding_graph_artifact_path=<path> -e catalog_artifact_path=<path>.
      loop: "{{ artifact_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create the RQ jobs directory
      ansible.builtin.file:
        path: "{{ rq_jobs_dir }}"
        state: directory
        mode: "0755"

    - name: Copy the public-artifact-check job body (same file every worker gets, unmodified)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/public_artifact_check_job.py"
        dest: "{{ rq_jobs_dir }}/public_artifact_check_job.py"
        mode: "0644"

    - name: Copy the pathfinding graph artifact
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../{{ pathfinding_graph_artifact_path }}"
        dest: "{{ rq_jobs_dir }}/pathfinding-graph.v1.json"
        mode: "0644"

    - name: Copy the catalog artifact
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../{{ catalog_artifact_path }}"
        dest: "{{ rq_jobs_dir }}/albums.v1.json"
        mode: "0644"
      register: artifact_copy

    - name: Report deployment
      ansible.builtin.debug:
        msg:
          - "host: {{ inventory_hostname }}"
          - "job body + artifacts deployed to {{ rq_jobs_dir }}/ (changed={{ artifact_copy.changed }})"
