name: Validate catalog tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install project
        # --extra jobs: redis/rq, needed to import scripts/submit_artifact_check.py
        # and scripts/submit_research_platform_job.py even though the tests
        # never touch a real broker. --all-packages: packages/research is a leaf
        # workspace member (nothing depends on it, unlike platform/contracts),
        # so a bare `uv sync` never installs it. --extra graph: networkx/
        # igraph/rustworkx (packages/research's optional graph-benchmark
        # extra) -- installed in CI too so test_graph_bench.py actually runs
        # instead of silently skipping via pytest.importorskip.
        run: uv sync --all-packages --extra dev --extra jobs --extra graph --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Validate real public artifacts
        run: uv run networked-players-catalog validate-public-artifacts
      # `make check` has always run this too, but CI did not -- so the
      # committed inclusion audit could drift from the catalog on main without
      # anything noticing. Added 2026-08-27 (Phase 7 preflight); CI and
      # `make check` now gate on the same set.
      - name: Validate the committed album-catalog inclusion audit
        run: uv run networked-players-catalog validate-album-catalog-audit
